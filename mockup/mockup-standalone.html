<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Mockup: Login, SingUp & กรอกที่อยู่</title>
  
  <!-- Google Fonts: Kanit & Inter for ultra-crisp Thai & English typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <style>
/* ========================================================
   DESIGN SYSTEM & GLOBAL VARIABLES
   Matching the reference mockup colors, fonts & spacing
   ======================================================== */
:root {
  /* Phone Canvas Background (Soft pale icy-blue from reference) */
  --phone-bg: #f2f7fb;
  --phone-border: rgba(255, 255, 255, 0.08);

  /* Primary Accent: Mint/Teal from reference button */
  --color-mint: #6ce5b9;
  --color-mint-hover: #5bd4a8;
  --color-mint-active: #4ac297;
  --color-mint-dark-text: #0e201b;

  /* Form Elements */
  --input-bg: #eef4f8;
  --input-border: #d4dde6;
  --input-border-hover: #b0c2d3;
  --input-border-focus: #5bd4a8;
  --input-text: #1e293b;
  --input-placeholder: #8e9faa;

  /* Typography Colors */
  --text-main: #0a0e14;
  --text-muted: #4e5d6c;
  --text-light: #94a3b8;

  /* Canvas Environment */
  --canvas-bg: #1e1e24;
  --canvas-card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);

  /* Fonts */
  --font-thai: 'Kanit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-en: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ========================================================
   BASE RESETS & DEFAULTS
   ======================================================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-en);
  background-color: var(--canvas-bg);
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========================================================
   TOP NAVIGATION & CONTROLS
   ======================================================== */
.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  background: rgba(22, 22, 29, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
  gap: 16px;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-badge {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  background: linear-gradient(135deg, #10b981, #06b6d4);
  color: #022c22;
  padding: 4px 10px;
  border-radius: 9999px;
}

.nav-brand h1 {
  font-size: 18px;
  font-weight: 600;
  color: #f1f5f9;
  letter-spacing: -0.02em;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.view-switcher {
  display: inline-flex;
  background: #2a2b33;
  padding: 4px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.view-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  color: #94a3b8;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-thai);
}

.view-btn:hover {
  color: #ffffff;
}

.view-btn.active {
  background: #3b3d4a;
  color: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}

.autofill-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(108, 229, 185, 0.12);
  color: #6ce5b9;
  border: 1px solid rgba(108, 229, 185, 0.3);
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-thai);
  transition: all 0.2s ease;
}

.autofill-btn:hover {
  background: rgba(108, 229, 185, 0.25);
  transform: translateY(-1px);
}

/* ========================================================
   FLOW STEPPER (Interactive Step Indicator)
   ======================================================== */
.flow-stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 24px;
  background: #18181f;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.step-item {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  opacity: 0.5;
  transition: all 0.25s ease;
}

.step-item.active {
  opacity: 1;
}

.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #323542;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}

.step-item.active .step-num {
  background: var(--color-mint);
  color: var(--color-mint-dark-text);
  box-shadow: 0 0 12px rgba(108, 229, 185, 0.4);
}

.step-label {
  font-size: 14px;
  font-weight: 600;
  color: #f8fafc;
  font-family: var(--font-thai);
}

.step-line {
  width: 60px;
  height: 2px;
  background: #323542;
  margin: 0 16px;
  border-radius: 2px;
}

.step-line.active {
  background: var(--color-mint);
}

/* ========================================================
   CANVAS & SCREENS WRAPPER
   ======================================================== */
.canvas-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 36px 20px 48px;
  overflow-x: auto;
  overflow-y: auto;
}

.screens-wrapper {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 24px;
  width: auto;
  margin: 0 auto;
  transition: all 0.3s ease;
}

.screens-wrapper.grid-mode {
  flex-wrap: nowrap; /* Keep 3 screens strictly side-by-side like original mockup */
  min-width: min-content;
}

/* ========================================================
   PHONE DEVICE CARD
   ======================================================== */
.device-card {
  width: 315px;
  min-height: 650px;
  background-color: var(--phone-bg);
  border-radius: 28px;
  box-shadow: var(--canvas-card-shadow);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.12);
  flex-shrink: 0;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
}

.device-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.15);
}

/* Notch & Status Bar */
.device-notch {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  color: #475569;
  font-size: 12px;
  font-weight: 600;
  user-select: none;
}

.notch-island {
  width: 90px;
  height: 18px;
  background: #111827;
  border-radius: 12px;
  margin-top: 4px;
}

.notch-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Screen Content Area */
.screen-content {
  flex: 1;
  padding: 30px 28px 36px;
  display: flex;
  flex-direction: column;
}

/* Screen Titles */
.screen-title {
  font-size: 32px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.03em;
  margin-bottom: 24px;
  line-height: 1.15;
}

.screen-title.text-center {
  text-align: center;
}

.screen-title.text-left {
  text-align: left;
}

.thai-title {
  font-family: var(--font-thai);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

.screen-subtitle.thai-sub {
  font-family: var(--font-thai);
  font-size: 13px;
  color: #4b5563;
  margin-bottom: 22px;
  line-height: 1.4;
  font-weight: 400;
}

/* ========================================================
   FORM CONTROLS & INPUTS
   ======================================================== */
.form-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
}

.input-group {
  position: relative;
  width: 100%;
}

.custom-input {
  width: 100%;
  height: 48px;
  background-color: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 10px;
  padding: 0 16px;
  font-size: 14px;
  color: var(--input-text);
  font-family: var(--font-thai);
  outline: none;
  transition: all 0.2s ease;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
}

.custom-input::placeholder {
  color: var(--input-placeholder);
  font-weight: 400;
}

.custom-input:hover {
  border-color: var(--input-border-hover);
  background-color: #f7fafc;
}

.custom-input:focus {
  border-color: var(--input-border-focus);
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(108, 229, 185, 0.25);
}

/* Password eye button */
.password-group {
  display: flex;
  align-items: center;
}

.btn-toggle-pw {
  position: absolute;
  right: 12px;
  background: transparent;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease;
}

.btn-toggle-pw:hover {
  color: #475569;
}

/* Input Grid (2 columns for address) */
.input-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.address-form {
  gap: 11px;
}

.address-form .custom-input {
  height: 44px;
  font-size: 13.5px;
  padding: 0 13px;
}

/* ========================================================
   BUTTONS
   ======================================================== */
.btn-container {
  display: flex;
  justify-content: center;
  margin-top: 4px;
  margin-bottom: 12px;
}

.btn-primary {
  background-color: var(--color-mint);
  color: var(--color-mint-dark-text);
  border: none;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
  padding: 11px 40px;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 3px 10px rgba(108, 229, 185, 0.28);
  font-family: var(--font-thai);
  user-select: none;
}

.btn-primary:hover {
  background-color: var(--color-mint-hover);
  transform: translateY(-1.5px);
  box-shadow: 0 6px 16px rgba(108, 229, 185, 0.4);
}

.btn-primary:active {
  transform: translateY(1px);
  background-color: var(--color-mint-active);
}

/* Full width style for Address confirm button */
.address-btn-container {
  margin-top: 8px;
  margin-bottom: 0;
  width: 100%;
}

.address-btn-container .btn-primary {
  width: 100%;
  padding: 13px 20px;
  font-size: 16px;
  border-radius: 10px;
}

/* ========================================================
   SOCIAL LOGIN - CIRCULAR BUTTONS (Screen 1)
   ======================================================== */
.social-login-circular {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 14px;
  margin-bottom: 24px;
}

.circle-social-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  transition: all 0.2s ease;
}

.circle-social-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
  border-color: #cbd5e1;
}

.circle-social-btn.fb-circle {
  background: transparent;
  border: none;
  box-shadow: none;
}

.circle-social-btn.fb-circle:hover {
  transform: scale(1.08);
}

/* ========================================================
   SOCIAL LOGIN - PILL STACKED BUTTONS (Screen 2)
   ======================================================== */
.social-login-stacked {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 6px;
  margin-bottom: 16px;
}

.pill-social-btn {
  display: flex;
  align-items: center;
  height: 44px;
  background-color: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 10px;
  padding: 0 16px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pill-social-btn:hover {
  background-color: #ffffff;
  border-color: #94a3b8;
  transform: translateY(-1px);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
}

.social-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  margin-right: 12px;
}

.social-text {
  font-size: 13.5px;
  color: #334155;
  font-weight: 500;
  font-family: var(--font-en);
}

/* ========================================================
   BOTTOM ACTIONS / SWITCH LINKS
   ======================================================== */
.bottom-action {
  text-align: center;
  margin-top: auto;
  padding-top: 10px;
}

.link-switch {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  text-decoration: none;
  letter-spacing: 0.04em;
  transition: opacity 0.2s ease;
  font-family: var(--font-thai);
}

.link-switch:hover {
  opacity: 0.75;
}

.link-switch.muted {
  font-weight: 500;
  color: #475569;
  font-size: 13px;
}

.link-switch.muted u {
  font-weight: 700;
  color: #0f172a;
}

/* ========================================================
   INTERACTIVE FLOW MODE
   When the user switches to single device sequential test
   ======================================================== */
.screens-wrapper.flow-mode .device-card {
  display: none;
  animation: fadeInPhone 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.screens-wrapper.flow-mode .device-card.active-step {
  display: flex;
}

@keyframes fadeInPhone {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ========================================================
   MODAL / POPUP (Success Dialog)
   ======================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 15, 0.75);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.2s ease forwards;
}

.modal-card {
  background: #ffffff;
  color: #0f172a;
  border-radius: 24px;
  padding: 32px 28px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
  animation: popUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.modal-icon-wrapper {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #d1fae5;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.modal-title {
  font-family: var(--font-thai);
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #065f46;
}

.modal-desc {
  font-family: var(--font-thai);
  font-size: 14px;
  color: #475569;
  margin-bottom: 20px;
}

.summary-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px 16px;
  text-align: left;
  font-family: var(--font-thai);
  font-size: 13px;
  color: #334155;
  margin-bottom: 24px;
  max-height: 200px;
  overflow-y: auto;
  line-height: 1.6;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px dashed #e2e8f0;
}

.summary-row:last-child {
  border-bottom: none;
}

.summary-label {
  color: #64748b;
  font-weight: 400;
}

.summary-val {
  font-weight: 600;
  color: #0f172a;
}

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.modal-btn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
}

.btn-secondary {
  background: #f1f5f9;
  color: #475569;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-thai);
}

.btn-secondary:hover {
  background: #e2e8f0;
  color: #1e293b;
}

/* ========================================================
   TOAST NOTIFICATION
   ======================================================== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 9999px;
  font-size: 14px;
  font-family: var(--font-thai);
  font-weight: 500;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes popUp {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* ========================================================
   RESPONSIVE DESIGN
   ======================================================== */
@media (max-width: 768px) {
  .screens-wrapper.grid-mode {
    flex-wrap: wrap;
    justify-content: center;
  }
}

@media (max-width: 640px) {
  .top-nav {
    padding: 14px 16px;
    flex-direction: column;
    align-items: stretch;
  }
  .nav-actions {
    flex-direction: column;
    width: 100%;
  }
  .view-switcher {
    width: 100%;
    display: flex;
  }
  .view-btn {
    flex: 1;
    justify-content: center;
    padding: 8px 10px;
    font-size: 12px;
  }
  .autofill-btn {
    width: 100%;
    justify-content: center;
  }
  .canvas-container {
    padding: 20px 12px;
  }
  .device-card {
    width: 100%;
    max-width: 360px;
  }
}

</style>
</head>
<body>
  <!-- Header / Navigation Control Bar -->
  <header class="top-nav">
    <div class="nav-brand">
      <div class="brand-badge">UI MOCKUP</div>
      <h1>Authentication & Address Flow</h1>
    </div>

    <!-- Mode Selector & Controls -->
    <div class="nav-actions">
      <div class="view-switcher" role="tablist">
        <button id="btn-view-grid" class="view-btn active" onclick="switchView('grid')" title="แสดง 3 หน้าพร้อมกันเหมือนภาพต้นฉบับ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="18" rx="1"/><rect x="17" y="3" width="5" height="18" rx="1"/></svg>
          <span>ดู 3 หน้าพร้อมกัน (Overview)</span>
        </button>
        <button id="btn-view-flow" class="view-btn" onclick="switchView('flow')" title="ทดสอบจำลองการใช้งานจริงทีละขั้นตอน">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><circle cx="12" cy="18" r="1"/></svg>
          <span>ทดลองใช้งานจริง (Interactive Flow)</span>
        </button>
      </div>

      <button class="autofill-btn" onclick="fillDemoData()" title="กรอกข้อมูลตัวอย่างอัตโนมัติ">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span>กรอกข้อมูลตัวอย่าง</span>
      </button>
    </div>
  </header>

  <!-- Flow Progress Indicator (Only shown in interactive flow mode) -->
  <div id="flow-stepper" class="flow-stepper" style="display: none;">
    <div class="step-item active" id="step-nav-1" onclick="goToStep(1)">
      <div class="step-num">1</div>
      <div class="step-label">Login</div>
    </div>
    <div class="step-line" id="line-1"></div>
    <div class="step-item" id="step-nav-2" onclick="goToStep(2)">
      <div class="step-num">2</div>
      <div class="step-label">SingUp</div>
    </div>
    <div class="step-line" id="line-2"></div>
    <div class="step-item" id="step-nav-3" onclick="goToStep(3)">
      <div class="step-num">3</div>
      <div class="step-label">กรอกที่อยู่</div>

/**
 * Switch between Grid Mode (all 3 screens side-by-side) and Flow Mode (single interactive device)
 */
function switchView(mode) {
  currentViewMode = mode;
  const wrapper = document.getElementById('screens-wrapper');
  const stepper = document.getElementById('flow-stepper');
  const btnGrid = document.getElementById('btn-view-grid');
  const btnFlow = document.getElementById('btn-view-flow');

  if (mode === 'grid') {
    wrapper.classList.remove('flow-mode');
    wrapper.classList.add('grid-mode');
    stepper.style.display = 'none';
    btnGrid.classList.add('active');
    btnFlow.classList.remove('active');
    
    // Remove active-step constraint to show all
    document.querySelectorAll('.device-card').forEach(card => {
      card.classList.remove('active-step');
    });
    showToast('สลับเป็นโหมด: ดู 3 หน้าพร้อมกัน (Overview)');
  } else {
    wrapper.classList.remove('grid-mode');
    wrapper.classList.add('flow-mode');
    stepper.style.display = 'flex';
    btnFlow.classList.add('active');
    btnGrid.classList.remove('active');
    
    goToStep(currentStep);
    showToast('สลับเป็นโหมด: ทดลองใช้งานจริง (Interactive Flow)');
  }
}

/**
 * Navigate to a specific step in Flow Mode (or scroll to it in Grid Mode)
 */
function goToStep(stepNumber) {
  currentStep = stepNumber;

  if (currentViewMode === 'flow') {
    // Hide all, show target step
    document.querySelectorAll('.device-card').forEach(card => {
      card.classList.remove('active-step');
    });
    const targetCard = document.getElementById(`screen-${stepNumber}`);
    if (targetCard) {
      targetCard.classList.add('active-step');
    }

    // Update stepper UI
    for (let i = 1; i <= 3; i++) {
      const stepNav = document.getElementById(`step-nav-${i}`);
      const line = document.getElementById(`line-${i}`);
      if (stepNav) {
        if (i === stepNumber) {
          stepNav.classList.add('active');
        } else if (i < stepNumber) {
          stepNav.classList.add('active');
        } else {
          stepNav.classList.remove('active');
        }
      }
      if (line) {
        if (i < stepNumber) {
          line.classList.add('active');
        } else {
          line.classList.remove('active');
        }
      }
    }
  } else {
    // In grid mode, smoothly scroll target card into view if needed
    const targetCard = document.getElementById(`screen-${stepNumber}`);
    if (targetCard) {
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      targetCard.style.outline = '2px solid #6ce5b9';
      setTimeout(() => {
        targetCard.style.outline = 'none';
      }, 1200);
    }
  }
}

function updateViewDisplay() {
  if (currentViewMode === 'flow') {
    goToStep(currentStep);
  }
}

/**
 * Password Visibility Toggle
 */
function togglePasswordVisibility(inputId, btnElement) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const eyeOpen = btnElement.querySelector('.eye-open');
  const eyeClosed = btnElement.querySelector('.eye-closed');

  if (input.type === 'password') {
    input.type = 'text';
    eyeOpen.style.display = 'none';
    eyeClosed.style.display = 'block';
  } else {
    input.type = 'password';
    eyeOpen.style.display = 'block';
    eyeClosed.style.display = 'none';
  }
}

/**
 * Handle Login Form Submit
 */
function handleLoginSubmit(event) {
  event.preventDefault();
  const email = document.getElementById('login-email').value;
  showToast(`เข้าสู่ระบบสำเร็จด้วย: ${email}`);

  // In flow mode, prompt to next or fill address
  if (currentViewMode === 'flow') {
    setTimeout(() => {
      goToStep(3); // Go to address step
    }, 600);
  }
}

/**
 * Handle SignUp Form Submit
 */
function handleSignupSubmit(event) {
  event.preventDefault();
  const name = document.getElementById('signup-name').value;
  const password = document.getElementById('signup-password').value;
  const confirmPassword = document.getElementById('signup-confirm-password').value;

  if (password !== confirmPassword) {
    showToast('⚠️ รหัสผ่านและการยืนยัน Password ไม่ตรงกัน!');
    const confirmInput = document.getElementById('signup-confirm-password');
    confirmInput.focus();
    confirmInput.style.borderColor = '#ef4444';
    setTimeout(() => {
      confirmInput.style.borderColor = '';
    }, 2000);
    return;
  }

  showToast(`ลงทะเบียนสำเร็จ ยินดีต้อนรับคุณ ${name}!`);

  // Move directly to Step 3 (กรอกที่อยู่) as natural registration progression
  setTimeout(() => {
    goToStep(3);
  }, 600);
}

/**
 * Format input fields as user types (Thai ID card & Phone Number)
 */
function setupInputMasks() {
  const idCardInput = document.getElementById('id-card');
  const phoneInput = document.getElementById('phone-number');

  if (idCardInput) {
    idCardInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 13) value = value.slice(0, 13);

      // Format as x-xxxx-xxxxx-xx-x
      let formatted = '';
      if (value.length > 0) formatted += value.substring(0, 1);
      if (value.length > 1) formatted += '-' + value.substring(1, 5);
      if (value.length > 5) formatted += '-' + value.substring(5, 10);
      if (value.length > 10) formatted += '-' + value.substring(10, 12);
      if (value.length > 12) formatted += '-' + value.substring(12, 13);

      e.target.value = formatted;
    });
  }

  if (phoneInput) {
    phoneInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 10) value = value.slice(0, 10);

      // Format as 0xx-xxx-xxxx
      let formatted = '';
      if (value.length > 0) formatted += value.substring(0, 3);
      if (value.length > 3) formatted += '-' + value.substring(3, 6);
      if (value.length > 6) formatted += '-' + value.substring(6, 10);

      e.target.value = formatted;
    });
  }
}

/**
 * Toast Notification Utility
 */
let toastTimeout;
function showToast(message) {
  const toast = document.getElementById('toast');
  if (!toast) return;

  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('show');
  }, 2800);
}
